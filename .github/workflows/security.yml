name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install scanners and package
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install . bandit pip-audit
      - name: Static security scan
        run: bandit -q -r anchor
      - name: Dependency audit
        run: pip-audit --local
