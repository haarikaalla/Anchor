<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410" role="img" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>anchor — belief memory that refuses to lie to you</title><desc>Anchor detecting a contradiction instead of overwriting memory, resolving it, and verifying the tamper-evident audit chain.</desc><style>.t{font-family:ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;font-size:14px;dominant-baseline:middle;white-space:pre}.cmd{fill:#e8edf9}.out{fill:#dbe4f7}.dim{fill:#7b8bb0}.ok{fill:#34d399}.warn{fill:#fbbf24}.err{fill:#fb7185}.accent{fill:#a78bfa}.prompt{fill:#5eead4;font-weight:600}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.caret{fill:#5eead4;animation:blink 1s steps(1) infinite}@keyframes k0{0%,1.8015%{clip-path:inset(0 100% 0 0)}10.8089%,100%{clip-path:inset(0 -6px 0 0)}}.l0{animation:k0 22.20s linear infinite}@keyframes c0{0%,1.8015%{opacity:0}10.8089%,13.8089%{opacity:1}14.0089%,100%{opacity:0}}.r0{animation:c0 22.20s linear infinite}@keyframes k1{0%,12.0699%{opacity:0;transform:translateX(-5px)}13.1699%,100%{opacity:1;transform:translateX(0)}}.l1{animation:k1 22.20s ease-out infinite;opacity:0}@keyframes k2{0%,16.4835%{clip-path:inset(0 100% 0 0)}25.4909%,100%{clip-path:inset(0 -6px 0 0)}}.l2{animation:k2 22.20s linear infinite}@keyframes c2{0%,16.4835%{opacity:0}25.4909%,28.4909%{opacity:1}28.6909%,100%{opacity:0}}.r2{animation:c2 22.20s linear infinite}@keyframes k3{0%,26.7519%{opacity:0;transform:translateX(-5px)}27.8519%,100%{opacity:1;transform:translateX(0)}}.l3{animation:k3 22.20s ease-out infinite;opacity:0}@keyframes k4{0%,31.1656%{clip-path:inset(0 100% 0 0)}40.1729%,100%{clip-path:inset(0 -6px 0 0)}}.l4{animation:k4 22.20s linear infinite}@keyframes c4{0%,31.1656%{opacity:0}40.1729%,43.1729%{opacity:1}43.3729%,100%{opacity:0}}.r4{animation:c4 22.20s linear infinite}@keyframes k5{0%,41.434%{opacity:0;transform:translateX(-5px)}42.534%,100%{opacity:1;transform:translateX(0)}}.l5{animation:k5 22.20s ease-out infinite;opacity:0}@keyframes k6{0%,42.0195%{opacity:0;transform:translateX(-5px)}43.1195%,100%{opacity:1;transform:translateX(0)}}.l6{animation:k6 22.20s ease-out infinite;opacity:0}@keyframes k7{0%,46.4331%{clip-path:inset(0 100% 0 0)}50.027%,100%{clip-path:inset(0 -6px 0 0)}}.l7{animation:k7 22.20s linear infinite}@keyframes c7{0%,46.4331%{opacity:0}50.027%,53.027%{opacity:1}53.227%,100%{opacity:0}}.r7{animation:c7 22.20s linear infinite}@keyframes k8{0%,51.2881%{opacity:0;transform:translateX(-5px)}52.3881%,100%{opacity:1;transform:translateX(0)}}.l8{animation:k8 22.20s ease-out infinite;opacity:0}@keyframes k9{0%,55.0261%{clip-path:inset(0 100% 0 0)}64.0335%,100%{clip-path:inset(0 -6px 0 0)}}.l9{animation:k9 22.20s linear infinite}@keyframes c9{0%,55.0261%{opacity:0}64.0335%,67.0335%{opacity:1}67.2335%,100%{opacity:0}}.r9{animation:c9 22.20s linear infinite}@keyframes k10{0%,65.2945%{opacity:0;transform:translateX(-5px)}66.3945%,100%{opacity:1;transform:translateX(0)}}.l10{animation:k10 22.20s ease-out infinite;opacity:0}@keyframes k11{0%,69.7082%{clip-path:inset(0 100% 0 0)}76.7249%,100%{clip-path:inset(0 -6px 0 0)}}.l11{animation:k11 22.20s linear infinite}@keyframes c11{0%,69.7082%{opacity:0}76.7249%,79.7249%{opacity:1}79.9249%,100%{opacity:0}}.r11{animation:c11 22.20s linear infinite}@keyframes k12{0%,77.9859%{opacity:0;transform:translateX(-5px)}79.0859%,100%{opacity:1;transform:translateX(0)}}.l12{animation:k12 22.20s ease-out infinite;opacity:0}@keyframes k13{0%,82.3996%{clip-path:inset(0 100% 0 0)}85.9935%,100%{clip-path:inset(0 -6px 0 0)}}.l13{animation:k13 22.20s linear infinite}@keyframes c13{0%,82.3996%{opacity:0}85.9935%,88.9935%{opacity:1}89.1935%,100%{opacity:0}}.r13{animation:c13 22.20s linear infinite}@keyframes k14{0%,87.2545%{opacity:0;transform:translateX(-5px)}88.3545%,100%{opacity:1;transform:translateX(0)}}.l14{animation:k14 22.20s ease-out infinite;opacity:0}</style><rect width="920" height="410" rx="12" fill="#0b1020"/><rect width="920" height="36" rx="12" fill="#151c30"/><rect y="24" width="920" height="12" fill="#151c30"/><circle cx="22" cy="18" r="5.5" fill="#fb7185"/><circle cx="41" cy="18" r="5.5" fill="#fbbf24"/><circle cx="60" cy="18" r="5.5" fill="#34d399"/><text x="460" y="18" text-anchor="middle" font-size="12.5" fill="#7b8bb0" dominant-baseline="middle">anchor — belief memory that refuses to lie to you</text><g class="l0"><text class="t prompt" x="22" y="65">$</text><text class="t cmd" x="38.8" y="65">anchor observe user lives_in Berlin --source-id chat --trust 0.9</text></g><rect class="r0" x="577.4" y="57" width="8" height="16" fill="#5eead4" opacity="0"/><text class="t ok l1" x="38.8" y="87">CREATED     user lives_in Berlin   conf=0.66  status=provisional</text><g class="l2"><text class="t prompt" x="22" y="109">$</text><text class="t cmd" x="38.8" y="109">anchor observe user lives_in Berlin --source-id calendar --trust 0.9</text></g><rect class="r2" x="611" y="101" width="8" height="16" fill="#5eead4" opacity="0"/><text class="t ok l3" x="38.8" y="131">REINFORCED  2 independent sources  conf=0.74  status=active</text><g class="l4"><text class="t prompt" x="22" y="153">$</text><text class="t cmd" x="38.8" y="153">anchor observe user lives_in Munich --source-id chat --trust 0.95</text></g><rect class="r4" x="585.8" y="145" width="8" height="16" fill="#5eead4" opacity="0"/><text class="t err l5" x="38.8" y="175">CONTRADICTED  conflicting claim detected (functional)</text><text class="t dim l6" x="38.8" y="197">            Berlin was NOT overwritten — both claims kept, flagged for review</text><g class="l7"><text class="t prompt" x="22" y="219">$</text><text class="t cmd" x="38.8" y="219">anchor contradictions</text></g><rect class="r7" x="216.2" y="211" width="8" height="16" fill="#5eead4" opacity="0"/><text class="t warn l8" x="38.8" y="241">OPEN  user lives_in Berlin   vs   user lives_in Munich</text><g class="l9"><text class="t prompt" x="22" y="263">$</text><text class="t cmd" x="38.8" y="263">anchor resolve &lt;id&gt; --strategy reliable --actor human</text></g><rect class="r9" x="485" y="255" width="8" height="16" fill="#5eead4" opacity="0"/><text class="t ok l10" x="38.8" y="285">RESOLVED  winner=Munich   loser=Berlin -&gt; superseded (kept for history)</text><g class="l11"><text class="t prompt" x="22" y="307">$</text><text class="t cmd" x="38.8" y="307">anchor recall &quot;where does the user live?&quot;</text></g><rect class="r11" x="384.2" y="299" width="8" height="16" fill="#5eead4" opacity="0"/><text class="t out l12" x="38.8" y="329">0.212  user lives_in Munich         conf=0.66  active</text><g class="l13"><text class="t prompt" x="22" y="351">$</text><text class="t cmd" x="38.8" y="351">anchor audit --verify</text></g><rect class="r13" x="216.2" y="343" width="8" height="16" fill="#5eead4" opacity="0"/><text class="t accent l14" x="38.8" y="373">7 hash-chained events   tamper-evident: True</text></svg>
