<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="820" height="440" rx="12" fill="#0d1117"/>
  <text x="40" y="44" fill="#c9d1d9" font-size="22" font-weight="700">A belief's life — confidence over time</text>
  <text x="40" y="68" fill="#8b949e" font-size="14">Real values from <tspan fill="#58a6ff">python -m anchor.cli.app demo</tspan> — reinforcement lifts, contradiction &amp; decay lower.</text>

  <!-- axes -->
  <line x1="70" y1="100" x2="70" y2="330" stroke="#30363d" stroke-width="1.5"/>
  <line x1="70" y1="330" x2="770" y2="330" stroke="#30363d" stroke-width="1.5"/>
  <!-- y gridlines 0.4..0.8 -->
  <line x1="70" y1="330" x2="770" y2="330" stroke="#21262d" stroke-dasharray="3 4"/>
  <line x1="70" y1="272.5" x2="770" y2="272.5" stroke="#21262d" stroke-dasharray="3 4"/>
  <line x1="70" y1="215" x2="770" y2="215" stroke="#21262d" stroke-dasharray="3 4"/>
  <line x1="70" y1="157.5" x2="770" y2="157.5" stroke="#21262d" stroke-dasharray="3 4"/>
  <line x1="70" y1="100" x2="770" y2="100" stroke="#21262d" stroke-dasharray="3 4"/>
  <text x="62" y="335" fill="#6e7681" font-size="12" text-anchor="end">0.40</text>
  <text x="62" y="277" fill="#6e7681" font-size="12" text-anchor="end">0.50</text>
  <text x="62" y="220" fill="#6e7681" font-size="12" text-anchor="end">0.60</text>
  <text x="62" y="162" fill="#6e7681" font-size="12" text-anchor="end">0.70</text>
  <text x="62" y="105" fill="#6e7681" font-size="12" text-anchor="end">0.80</text>

  <!-- x labels (event stages) -->
  <text x="150" y="352" fill="#8b949e" font-size="12" text-anchor="middle">observe</text>
  <text x="150" y="368" fill="#6e7681" font-size="11" text-anchor="middle">day 0</text>
  <text x="320" y="352" fill="#8b949e" font-size="12" text-anchor="middle">reinforce</text>
  <text x="320" y="368" fill="#6e7681" font-size="11" text-anchor="middle">day 3</text>
  <text x="490" y="352" fill="#8b949e" font-size="12" text-anchor="middle">contradiction</text>
  <text x="490" y="368" fill="#6e7681" font-size="11" text-anchor="middle">day 30</text>
  <text x="660" y="352" fill="#8b949e" font-size="12" text-anchor="middle">decay</text>
  <text x="660" y="368" fill="#6e7681" font-size="11" text-anchor="middle">day 120</text>

  <!-- map conf to y: y = 330 - (conf-0.40)/0.40*230 -->
  <!-- Berlin: 0.655(150) -> 0.737(320) -> 0.589(490) superseded -->
  <polyline points="150,183.6 320,136.5 490,221.6" fill="none" stroke="#58a6ff" stroke-width="3"/>
  <circle cx="150" cy="183.6" r="5" fill="#58a6ff"/>
  <circle cx="320" cy="136.5" r="5" fill="#58a6ff"/>
  <circle cx="490" cy="221.6" r="6" fill="#f85149" stroke="#0d1117" stroke-width="1.5"/>
  <text x="150" y="173" fill="#58a6ff" font-size="12" text-anchor="middle">0.655</text>
  <text x="320" y="126" fill="#58a6ff" font-size="12" text-anchor="middle">0.737</text>
  <text x="500" y="212" fill="#f85149" font-size="12">0.589 · superseded</text>

  <!-- Munich: appears at contradiction 0.661(490) -> decay 0.528(660) -->
  <polyline points="490,206.4 660,282.9" fill="none" stroke="#3fb950" stroke-width="3"/>
  <circle cx="490" cy="206.4" r="5" fill="#3fb950"/>
  <circle cx="660" cy="282.9" r="5" fill="#3fb950"/>
  <text x="490" y="196" fill="#3fb950" font-size="12" text-anchor="middle">0.661</text>
  <text x="672" y="278" fill="#3fb950" font-size="12">0.528 · active</text>

  <!-- contradiction marker -->
  <line x1="490" y1="100" x2="490" y2="330" stroke="#d29922" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="490" y="94" fill="#d29922" font-size="12" text-anchor="middle" font-weight="600">NOT overwritten →</text>

  <!-- legend -->
  <rect x="120" y="392" width="14" height="14" rx="3" fill="#58a6ff"/>
  <text x="140" y="404" fill="#8b949e" font-size="13">user lives_in Berlin</text>
  <rect x="320" y="392" width="14" height="14" rx="3" fill="#3fb950"/>
  <text x="340" y="404" fill="#8b949e" font-size="13">user lives_in Munich</text>
  <circle cx="560" cy="399" r="5" fill="#f85149"/>
  <text x="574" y="404" fill="#8b949e" font-size="13">contradiction / superseded</text>
</svg>
