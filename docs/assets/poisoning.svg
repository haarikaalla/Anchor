<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>Memory poisoning: how much of the attack got through?</title><desc>A low-trust source repeatedly asserts a false value after the real update. Higher is better — 1.00 means every attack was rejected.</desc><style>@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes fade{from{opacity:0}to{opacity:1}}.bar{transform-box:fill-box;transform-origin:bottom;animation:grow 1.15s cubic-bezier(.34,1.2,.5,1) both}.vlab{animation:fade .5s ease both}.ax{fill:#8ea0c4;font-size:12px}.cat{fill:#e8edf9;font-size:13px;font-weight:550}</style><rect width="900" height="340" rx="14" fill="#0b1020"/><text x="28" y="34" font-size="17" font-weight="650" fill="#e8edf9">Memory poisoning: how much of the attack got through?</text><text x="28" y="55" font-size="12.5" fill="#8ea0c4">A low-trust source repeatedly asserts a false value after the real update. Higher is better — 1.00 means every attack was rejected.</text><line x1="56" y1="276.0" x2="874" y2="276.0" stroke="rgba(120,145,200,0.16)" stroke-width="1"/><text class="ax" x="46" y="280.0" text-anchor="end">0.00</text><line x1="56" y1="226.5" x2="874" y2="226.5" stroke="rgba(120,145,200,0.16)" stroke-width="1"/><text class="ax" x="46" y="230.5" text-anchor="end">0.25</text><line x1="56" y1="177.0" x2="874" y2="177.0" stroke="rgba(120,145,200,0.16)" stroke-width="1"/><text class="ax" x="46" y="181.0" text-anchor="end">0.50</text><line x1="56" y1="127.5" x2="874" y2="127.5" stroke="rgba(120,145,200,0.16)" stroke-width="1"/><text class="ax" x="46" y="131.5" text-anchor="end">0.75</text><line x1="56" y1="78.0" x2="874" y2="78.0" stroke="rgba(120,145,200,0.16)" stroke-width="1"/><text class="ax" x="46" y="82.0" text-anchor="end">1.00</text><rect x="56" y="48" width="11" height="11" rx="3" fill="#a78bfa"/><text class="ax" x="73" y="58" font-weight="400" fill="#8ea0c4">poison resistance</text><rect class="bar" x="79.3" y="274.5" width="117.1" height="1.5" rx="4" fill="#a78bfa" style="animation-delay:0.00s"/><text class="vlab" x="137.8" y="267.5" text-anchor="middle" font-size="11.5" fill="#8ea0c4" font-weight="400" style="animation-delay:0.90s">0.00</text><text class="cat" x="137.8" y="302" text-anchor="middle">summary(overwrite)</text><rect class="bar" x="242.9" y="274.5" width="117.1" height="1.5" rx="4" fill="#a78bfa" style="animation-delay:0.09s"/><text class="vlab" x="301.4" y="267.5" text-anchor="middle" font-size="11.5" fill="#8ea0c4" font-weight="400" style="animation-delay:0.99s">0.00</text><text class="cat" x="301.4" y="302" text-anchor="middle">recency-window</text><rect class="bar" x="406.5" y="254.0" width="117.1" height="22.0" rx="4" fill="#a78bfa" style="animation-delay:0.18s"/><text class="vlab" x="465.0" y="247.0" text-anchor="middle" font-size="11.5" fill="#8ea0c4" font-weight="400" style="animation-delay:1.08s">0.11</text><text class="cat" x="465.0" y="302" text-anchor="middle">trust-vote</text><rect class="bar" x="570.1" y="165.9" width="117.1" height="110.1" rx="4" fill="#a78bfa" style="animation-delay:0.27s"/><text class="vlab" x="628.6" y="158.9" text-anchor="middle" font-size="11.5" fill="#8ea0c4" font-weight="400" style="animation-delay:1.17s">0.56</text><text class="cat" x="628.6" y="302" text-anchor="middle">rag(vector)</text><rect class="bar" x="733.7" y="78.0" width="117.1" height="198.0" rx="4" fill="#a78bfa" style="animation-delay:0.36s"/><text class="vlab" x="792.2" y="71.0" text-anchor="middle" font-size="11.5" fill="#8ea0c4" font-weight="400" style="animation-delay:1.26s">1.00</text><text class="cat" x="792.2" y="302" text-anchor="middle">anchor</text><line x1="56" y1="276" x2="874" y2="276" stroke="#8ea0c4" stroke-width="1.2" opacity=".6"/></svg>
