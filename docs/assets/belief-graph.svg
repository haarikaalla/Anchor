<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>Memory as a confidence-weighted knowledge graph</title><desc>Edge thickness is Bayesian confidence. The pulsing red edge is an open contradiction: both claims are retained until it is resolved.</desc><style>@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}@keyframes flow{to{stroke-dashoffset:-24}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}.e{animation:fade .8s ease both}.c{stroke:#fb7185;stroke-dasharray:6 5;animation:fade .8s ease both,flow 1.1s linear infinite,pulse 1.6s ease-in-out infinite}.n{transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.34,1.4,.5,1) both}.nt{fill:#e8edf9;font-size:11.5px;text-anchor:middle}.et{fill:#8ea0c4;font-size:10px;text-anchor:middle}</style><rect width="900" height="520" rx="14" fill="#0b1020"/><text x="28" y="34" font-size="17" font-weight="650" fill="#e8edf9">Memory as a confidence-weighted knowledge graph</text><text x="28" y="55" font-size="12.5" fill="#8ea0c4">Edge thickness is Bayesian confidence. The pulsing red edge is an open contradiction: both claims are retained until it is resolved.</text><line class="e" x1="482.9" y1="268.4" x2="762.7" y2="290.8" stroke="rgba(148,170,220,.45)" stroke-width="2.81" style="animation-delay:0.00s"/><text class="et e" x="622.8" y="274.6" style="animation-delay:0.30s">works_at</text><line class="e" x1="482.9" y1="268.4" x2="738.4" y2="452.0" stroke="rgba(148,170,220,.45)" stroke-width="2.62" style="animation-delay:0.05s"/><text class="et e" x="610.7" y="355.2" style="animation-delay:0.35s">lives_in</text><line class="e" x1="482.9" y1="268.4" x2="169.6" y2="434.7" stroke="rgba(148,170,220,.45)" stroke-width="2.60" style="animation-delay:0.10s"/><text class="et e" x="326.3" y="346.6" style="animation-delay:0.40s">speaks</text><line class="e" x1="762.7" y1="290.8" x2="577.6" y2="452.0" stroke="rgba(148,170,220,.45)" stroke-width="2.60" style="animation-delay:0.15s"/><text class="et e" x="670.1" y="366.4" style="animation-delay:0.45s">based_in</text><line class="e" x1="482.9" y1="268.4" x2="202.1" y2="102.0" stroke="rgba(148,170,220,.45)" stroke-width="2.57" style="animation-delay:0.20s"/><text class="et e" x="342.5" y="180.2" style="animation-delay:0.50s">manages</text><line class="e" x1="482.9" y1="268.4" x2="760.5" y2="102.0" stroke="rgba(148,170,220,.45)" stroke-width="2.57" style="animation-delay:0.25s"/><text class="et e" x="621.7" y="180.2" style="animation-delay:0.55s">speaks</text><line class="e" x1="482.9" y1="268.4" x2="577.6" y2="452.0" stroke="rgba(148,170,220,.45)" stroke-width="2.43" style="animation-delay:0.30s"/><text class="et e" x="530.3" y="355.2" style="animation-delay:0.60s">lives_in</text><line class="c" x1="738.4" y1="452.0" x2="577.6" y2="452.0" stroke="#fb7185" stroke-width="3.23" style="animation-delay:0.35s"/><text class="et e" x="658.0" y="447.0" style="animation-delay:0.65s">conflict · functional</text><circle class="n" cx="482.9" cy="268.4" r="28.0" fill="#131a2b" stroke="#a78bfa" stroke-width="1.8" style="animation-delay:0.00s"/><text class="nt e" x="482.9" y="272.4" style="animation-delay:0.25s">Ada</text><circle class="n" cx="762.7" cy="290.8" r="25.0" fill="#131a2b" stroke="#a78bfa" stroke-width="1.8" style="animation-delay:0.06s"/><text class="nt e" x="762.7" y="294.8" style="animation-delay:0.31s">Acme</text><circle class="n" cx="738.4" cy="452.0" r="22.0" fill="#131a2b" stroke="#a78bfa" stroke-width="1.8" style="animation-delay:0.12s"/><text class="nt e" x="738.4" y="456.0" style="animation-delay:0.37s">Munich</text><circle class="n" cx="169.6" cy="434.7" r="22.0" fill="#131a2b" stroke="#a78bfa" stroke-width="1.8" style="animation-delay:0.18s"/><text class="nt e" x="169.6" y="438.7" style="animation-delay:0.43s">