<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>Memory as a confidence-weighted knowledge graph</title><desc>Edge thickness is Bayesian confidence. The pulsing red edge is an open contradiction: both claims are retained until it is resolved.</desc><style>@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}@keyframes flow{to{stroke-dashoffset:-24}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}.e{animation:fade .8s ease both}.c{stroke:#fb7185;stroke-dasharray:6 5;animation:fade .8s ease both,flow 1.1s linear infinite,pulse 1.6s ease-in-out infinite}.n{transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.34,1.4,.5,1) both}.nt{fill:#e8edf9;font-size:11.5px;text-anchor:middle}.et{fill:#8ea0c4;font-size:10px;text-anchor:middle}</style><rect width="900" height="520" rx="14" fill="#0b1020"/><text x="28" y="34" font-size="17" font-weight="650" fill="#e8edf9">Memory as a confidence-weighted knowledge graph</text><text x="28" y="55" font-size="12.5" fill="#8ea0c4">Edge thickness is Bayesian confidence. The pulsing red edge is an open contradiction: both claims are retained until it is resolved.</text><line class="e" x1="489.7" y1="242.1" x2="690.1" y2="452.0" stroke="rgba(148,170,220,.45)" stroke-width="2.81" style="animation-delay:0.00s"/><text class="et e" x="589.9" y="342.1" style="animation-delay:0.30s">works_at</text><line class="e" x1="489.7" y1="242.1" x2="242.2" y2="452.0" stroke="rgba(148,170,220,.45)" stroke-width="2.62" style="animation-delay:0.05s"/><text class="et e" x="366.0" y="342.1" style="animation-delay:0.35s">lives_in</text><line class="e" x1="690.1" y1="452.0" x2="459.3" y2="452.0" stroke="rgba(148,170,220,.45)" stroke-width="2.60" style="animation-delay:0.10s"/><text class="et e" x="574.7" y="447.0" style="animation-delay:0.40s">based_in</text><line class="e" x1="489.7" y1="242.1" x2="178.1" y2="102.0" stroke="rgba(148,170,220,.45)" stroke-width="2.60" style="animation-delay:0.15s"/><text class="et e" x="333.9" y="167.1" style="animation-delay:0.45s">speaks</text><line class="e" x1="489.7" y1="242.1" x2="646.8" y2="102.0" stroke="rgba(148,170,220,.45)" stroke-width="2.57" style="animation-delay:0.20s"/><text class="et e" x="568.3" y="167.1" style="animation-delay:0.50s">manages</text><line class="e" x1="489.7" y1="242.1" x2="840.0" y2="102.0" stroke="rgba(148,170,220,.45)" stroke-width="2.57" style="animation-delay:0.25s"/><text class="et e" x="664.9" y="167.1" style="animation-delay:0.55s">speaks</text><line class="e" x1="489.7" y1="242.1" x2="459.3" y2="452.0" stroke="rgba(148,170,220,.45)" stroke-width="2.43" style="animation-delay:0.30s"/><text class="et e" x="474.5" y="342.1" style="animation-delay:0.60s">lives_in</text><line class="c" x1="242.2" y1="452.0" x2="459.3" y2="452.0" stroke="#fb7185" stroke-width="3.23" style="animation-delay:0.35s"/><text class="et e" x="350.7" y="447.0" style="animation-delay:0.65s">conflict · functional</text><circle class="n" cx="489.7" cy="242.1" r="28.0" fill="#131a2b" stroke="#a78bfa" stroke-width="1.8" style="animation-delay:0.00s"/><text class="nt e" x="489.7" y="246.1" style="animation-delay:0.25s">Ada</text><circle class="n" cx="690.1" cy="452.0" r="25.0" fill="#131a2b" stroke="#a78bfa" stroke-width="1.8" style="animation-delay:0.06s"/><text class="nt e" x="690.1" y="456.0" style="animation-delay:0.31s">Acme</text><circle class="n" cx="242.2" cy="452.0" r="22.0" fill="#131a2b" stroke="#a78bfa" stroke-width="1.8" style="animation-delay:0.12s"/><text class="nt e" x="242.2" y="456.0" style="animation-delay:0.37s">Munich</text><circle class="n" cx="459.3" cy="452.0" r="25.0" fill="#131a2b" stroke="#a78bfa" stroke-width="1.8" style="animation-delay:0.18s"/><text class="nt e" x="459.3" y="456.0" style="animation-delay:0.43s">