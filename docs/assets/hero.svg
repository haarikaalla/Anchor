ospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end">functional</text><text x="502" y="332" font-size="11" fill="#8ea0c4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Berlin kept · confidence 0.79 → 0.75 · queued for review</text></g><g class="a13"><text x="488" y="372" font-size="17" fill="#5eead4" font-weight="700">✓</text><text x="510" y="372" font-size="13" fill="#e8edf9" font-weight="600">Still correct, and it can prove why.</text><text x="510" y="390" font-size="11" fill="#8ea0c4">hash-chained audit · explainable · human resolves the conflict</text></g></svg>
