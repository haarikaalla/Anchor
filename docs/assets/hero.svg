<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>Anchor — conventional memory overwrites and is silently wrong; Anchor keeps both claims and flags the contradiction</title><desc>Side-by-side comparison. A low-trust scraper claims the user lives in Munich. Conventional memory overwrites Berlin and is silently wrong with no record. Anchor keeps Berlin, lowers its confidence from 0.79 to 0.75, raises a contradiction for review, and retains a hash-chained audit trail.</desc><style>text{dominant-baseline:middle}@keyframes pulse{0%,100%{opacity:1;r:5}50%{opacity:.35;r:7}}.pulse{animation:pulse 1.5s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}.a1{opacity:0;animation:a1 11.0s linear infinite}@keyframes a1{0%,2.2727%{opacity:0;transform:translateY(10px)}6.3636%,100%{opacity:1;transform:translateY(0)}}.a2{opacity:0;animation:a2 11.0s linear infinite}@keyframes a2{0%,8.1818%{opacity:0;transform:translateY(10px)}12.2727%,100%{opacity:1;transform:translateY(0)}}.a3{opacity:0;animation:a3 11.0s linear infinite}@keyframes a3{0%,21.8182%{opacity:0;transform:translateY(10px)}25.9091%,100%{opacity:1;transform:translateY(0)}}.a4{opacity:0;animation:a4 11.0s linear infinite}@keyframes a4{0%,37.2727%{opacity:0;transform:translateY(10px)}41.3636%,100%{opacity:1;transform:translateY(0)}}.a5{transform-box:fill-box;transform-origin:left center;animation:a5 11.0s linear infinite}@keyframes a5{0%,39.5455%{transform:scaleX(0)}43.1818%,100%{transform:scaleX(1)}}.a6{opacity:0;animation:a6 11.0s linear infinite}@keyframes a6{0%,43.1818%{opacity:0;transform:translateY(0px)}47.2727%,100%{opacity:1;transform:translateY(0)}}.a7{opacity:0;animation:a7 11.0s linear infinite}@keyframes a7{0%,58.1818%{opacity:0;transform:translateY(10px)}62.2727%,100%{opacity:1;transform:translateY(0)}}.a8{opacity:0;animation:a8 11.0s linear infinite}@keyframes a8{0%,2.2727%{opacity:0;transform:translateY(10px)}6.3636%,100%{opacity:1;transform:translateY(0)}}.a9{opacity:0;animation:a9 11.0s linear infinite}@keyframes a9{0%,8.1818%{opacity:0;transform:translateY(10px)}12.2727%,100%{opacity:1;transform:translateY(0)}}.a10{transform-box:fill-box;transform-origin:left center;animation:a10 11.0s linear infinite}@keyframes a10{0%,8.1818%{transform:scaleX(0.0000)}14.5455%,100%{transform:scaleX(0.7872)}}.a11{opacity:0;animation:a11 11.0s linear infinite}@keyframes a11{0%,21.8182%{opacity:0;transform:translateY(10px)}25.9091%,100%{opacity:1;transform:translateY(0)}}.a12{opacity:0;animation:a12 11.0s linear infinite}@keyframes a12{0%,37.2727%{opacity:0;transform:translateY(10px)}41.3636%,100%{opacity:1;transform:translateY(0)}}.a13{opacity:0;animation:a13 11.0s linear infinite}@keyframes a13{0%,58.1818%{opacity:0;transform:translateY(10px)}62.2727%,100%{opacity:1;transform:translateY(0)}}</style><rect width="920" height="430" fill="#0b1020"/><text x="28" y="40" font-size="25" fill="#5eead4" font-weight="700">Anchor</text><text x="124" y="40" font-size="15" fill="#e8edf9">belief memory for AI agents</text><text x="28" y="62" font-size="13" fill="#8ea0c4">The same untrusted claim arrives at both. Only one of them is still telling you the truth afterwards.</text><rect x="24" y="84" width="428" height="322" rx="14" fill="rgba(148,175,235,0.05)" stroke="rgba(140,170,230,0.18)"/><rect x="24" y="84" width="428" height="3" rx="1.5" fill="#f87171" opacity="0.85"/><g class="a1"><text x="44" y="118" font-size="16" fill="#f87171" font-weight="700">Conventional memory</text><text x="432" y="118" font-size="12" fill="#8ea0c4" text-anchor="end">overwrite on update</text><line x1="42" y1="132" x2="434" y2="132" stroke="rgba(140,170,230,0.18)"/></g><g class="a2"><rect x="42" y="148" width="392" height="62" rx="10" fill="rgba(148,175,235,0.05)" stroke="rgba(140,170,230,0.18)"/><text x="58" y="172" font-size="11" fill="#8ea0c4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">user · lives_in</text><text x="58" y="194" font-size="18" fill="#e8edf9" font-weight="600">Berlin</text><text x="418" y="188" font-size="11" fill="#8ea0c4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end">no confidence · no sources</text></g><g class="a3"><rect x="42" y="222" width="392" height="46" rx="10" fill="rgba(251,191,36,0.06)" stroke="rgba(251,191,36,0.35)"/><text x="58" y="250" font-size="13" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">scraper_bot claims  “Munich”</text><text x="418" y="250" font-size="11" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end">trust 0.25</text></g><g class="a4"><rect x="42" y="284" width="392" height="58" rx="10" fill="rgba(248,113,113,0.06)" stroke="rgba(248,113,113,0.35)"/><text x="58" y="312" font-size="15" fill="#8ea0c4" font-weight="600">Berlin</text><rect class="a5" x="56" y="306" width="46" height="2" fill="#f87171"/><text x="116" y="312" font-size="15" fill="#8ea0c4">→</text><text class="a6" x="142" y="312" font-size="15" font-weight="600" fill="#f87171">Munich</text><text x="418" y="312" font-size="11" fill="#f87171" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end">OVERWRITTEN</text><text x="58" y="332" font-size="11" fill="#8ea0c4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">previous value gone · no conflict · no record it ever changed</text></g><g class="a7"><text x="44" y="372" font-size="17" fill="#f87171" font-weight="700">✕</text><text x="66" y="372" font-size="13" fill="#e8edf9" font-weight="600">Silently wrong. Nothing to detect.</text><text x="66" y="390" font-size="11" fill="#8ea0c4">one low-trust source rewrote the user’s reality</text></g><rect x="468" y="84" width="428" height="322" rx="14" fill="rgba(148,175,23