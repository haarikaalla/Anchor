[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anchor-memory"
version = "0.3.0"
description = "Anchor: persistent belief-memory infrastructure for AI agents with provenance, Bayesian confidence, reinforcement, temporal reasoning, contradiction detection, explainability, decay and human confirmation."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Haarika Alla", email = "harikaalla7@gmail.com" }]
keywords = [
    "memory", "agents", "llm", "mcp", "belief", "provenance", "rag",
    "knowledge-graph", "explainability", "ai-safety",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The core engine is intentionally dependency-free (pure stdlib) so it can be
# embedded anywhere and remains framework-independent and deterministic in tests.
# The HTTP dashboard, the belief graph and the SVG renderer are stdlib too.
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.0", "anthropic>=0.30"]
mcp = ["mcp>=1.0"]
cli = ["rich>=13.0"]
mem0 = ["mem0ai>=0.1"]
langchain = ["langchain-core>=0.2"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5"]
all = [
    "openai>=1.0",
    "anthropic>=0.30",
    "mcp>=1.0",
    "rich>=13.0",
    "mem0ai>=0.1",
    "langchain-core>=0.2",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]

[project.scripts]
anchor = "anchor.cli.app:main"
anchor-mcp = "anchor.mcp.server:main"
anchor-serve = "anchor.server.api:serve"

[tool.setuptools.packages.find]
where = ["."]
include = ["anchor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# A pragmatic, stable ruleset. BLE001 is ignored because Anchor deliberately
# uses broad `except Exception` for graceful degradation around optional
# dependencies (rich, mcp), the HTTP handler and interactive-shell resilience.
# RUF001-003 are ignored because the CLI, dashboard and generated SVGs use real
# typographic characters (–, ×, →) in user-facing copy on purpose.
select = ["E", "F", "I", "UP", "SIM", "RUF"]
ignore = ["BLE001", "RUF001", "RUF002", "RUF003"]
